<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="oceanDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Fundo / Céu -->
  <rect x="0" y="0" width="850" height="440" rx="10" fill="url(#sky)"/>

  <!-- Título do Diagrama -->
  <rect x="0" y="0" width="850" height="50" rx="10" fill="#0a2540"/>
  <text x="425" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">PERFIL OCEANOGRÁFICO EM CORTE: CANAL SUBMARINO DE BOA VIAGEM E PIEDADE</text>

  <!-- Linha de Nível de Maré Alta e Maré Baixa -->
  <!-- Nível Maré Alta -->
  <line x1="80" y1="140" x2="820" y2="140" stroke="#0369a1" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="815" y="132" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="end">🌊 Nível de Maré Alta (Preamar: recifes submersos)</text>

  <!-- Nível Maré Baixa -->
  <line x1="160" y1="210" x2="820" y2="210" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="815" y="202" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">⬇️ Nível de Maré Baixa (Baixa-mar: piscinas protegidas)</text>

  <!-- Volume de Água do Mar -->
  <path d="M 120,140 Q 250,140 400,140 L 400,320 C 350,330 280,310 220,270 L 120,140 Z" fill="url(#oceanDeep)"/>
  <path d="M 400,140 L 830,140 L 830,390 L 580,390 L 520,220 L 400,220 Z" fill="url(#oceanDeep)"/>

  <!-- Topografia do Fundo Marinho (Praia -> Canal -> Recife de Arenito -> Mar Aberto) -->
  <path d="M 0,100 L 90,120 L 140,160 L 180,240 C 230,330 330,330 380,260 L 420,210 L 470,210 L 510,260 L 560,370 L 850,390 L 850,440 L 0,440 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <!-- Camada de Areia Costeira -->
  <path d="M 0,100 L 90,120 L 140,160 L 180,240 C 220,290 280,310 320,310 L 0,310 Z" fill="url(#sand)"/>

  <!-- Bloco dos Recifes de Arenito (Beachrocks) -->
  <path d="M 400,210 L 430,175 L 480,175 L 510,220 L 490,290 L 390,280 Z" fill="#57534e" stroke="#292524" stroke-width="2"/>
  <text x="455" y="200" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RECIFES DE</text>
  <text x="455" y="215" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f5f5f4" text-anchor="middle">ARENITO</text>

  <!-- Silhueta Esquematizada de Tubarão no Canal -->
  <g transform="translate(260, 240) scale(0.28)">
    <path d="M 380,120 C 280,95 170,110 90,150 C 30,205 10,235 20,248 C 110,230 190,240 270,265 C 390,270 470,220 500,165 Z" fill="#0f172a"/>
    <path d="M 230,105 C 245,60 270,20 300,5 Z" fill="#0f172a"/>
    <path d="M 450,235 C 520,275 554,306 558,185 Z" fill="#0f172a"/>
  </g>

  <!-- Banhista na Beira da Praia -->
  <g transform="translate(75, 75)">
    <circle cx="10" cy="10" r="6" fill="#f87171"/>
    <line x1="10" y1="16" x2="10" y2="35" stroke="#f87171" stroke-width="3"/>
    <line x1="10" y1="35" x2="4" y2="48" stroke="#f87171" stroke-width="3"/>
    <line x1="10" y1="35" x2="16" y2="48" stroke="#f87171" stroke-width="3"/>
    <text x="10" y="-3" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Banhista</text>
  </g>

  <!-- Anotações Explicativas / Setas -->
  <!-- Canal Profundo -->
  <rect x="200" y="340" width="170" height="55" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="285" y="360" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">CANAL SUBMARINO</text>
  <text x="285" y="375" font-family="'Segoe UI', sans-serif" font-size="10" fill="#334155" text-anchor="middle">Profundidade: 3 a 8 metros</text>
  <text x="285" y="388" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Rota de predadores na maré alta</text>

  <!-- Zona de Mar Aberto -->
  <rect x="630" y="270" width="180" height="55" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="720" y="292" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">OCEANO ATLÂNTICO</text>
  <text x="720" y="307" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569" text-anchor="middle">Plataforma continental aberta</text>
  <text x="720" y="320" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Corrente de deriva norte</text>

  <!-- Destaque Educativo -->
  <rect x="25" y="385" width="400" height="35" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="225" y="407" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">⚠️ Risco crítico: Nadar sobre o canal durante a maré alta ou transpor os recifes.</text>
</svg>
